[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencli-toolkit"
version = "0.1.0"
description = "Battle-tested AI-agent & automation scripts as a unified CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "C C", email = ""}]
keywords = ["ai", "automation", "agent", "obsidian", "cloudflared", "cron"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.scripts]
otk = "otk.__main__:main"

[tool.setuptools]
packages = ["otk"]
include-package-data = true
